[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmw-signals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.48,<2",
  "asyncpraw>=7.8,<9",
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-pptx>=1,<2",
]

[project.scripts]
bmw-signals = "bmw_signals.cli:main"

[tool.setuptools.packages.find]
include = ["bmw_signals*"]
